[project]
name = "api-parity-py"
version = "0.0.1"
description = "Reference plugin: walks a Python package and emits its public API surface."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
api-parity-py = "api_parity_py.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api_parity_py"]
