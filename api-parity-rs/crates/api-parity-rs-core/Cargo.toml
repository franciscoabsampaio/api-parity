[package]
name = "api-parity-rs-core"
description = "Runtime types and inventory glue for the api-parity-rs port plugin."
version.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true

[dependencies]
inventory = "0.3"
api-parity-rs-macros = { workspace = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[features]
# Enables `dump_to_writer` and serde-derived JSON output. Off by default
# so target crates can take a no-deps dep.
serde = ["dep:serde", "dep:serde_json"]
