[package]
name = "api-parity-rs"
description = "CLI driver for the api-parity-rs port plugin (wraps `cargo run --bin api-parity-dump`)."
version.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true

[[bin]]
name = "api-parity-rs"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
