name: Build / Test / Draft

on:
  push:
    tags:
      - 'v*.*.*'
      - 'py-v*.*.*'
      - 'rs-v*.*.*'

jobs:
  parse-tag:
    name: Parse tag
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.parse.outputs.package }}
      dir: ${{ steps.parse.outputs.dir }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - id: parse
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # Match bare `vX.Y.Z` (the differ) or `<py|rs>-vX.Y.Z`.
          if [[ ! "$TAG" =~ ^(([a-z]+)-)?v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Tag $TAG does not match (py-|rs-)?vX.Y.Z" >&2
            exit 1
          fi
          PKG="${BASH_REMATCH[2]}"
          case "$PKG" in
            "")    DIR="api-parity" ;;
            py|rs) DIR="api-parity-$PKG" ;;
            *)     echo "Unknown package slug '$PKG' in tag $TAG" >&2; exit 1 ;;
          esac
          echo "package=$PKG" >> "$GITHUB_OUTPUT"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "version=${BASH_REMATCH[3]}" >> "$GITHUB_OUTPUT"

  build-python:
    needs: parse-tag
    if: ${{ needs.parse-tag.outputs.package != 'rs' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ needs.parse-tag.outputs.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build pytest

      - name: Verify pyproject version matches tag
        run: |
          PYVER=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$PYVER" != "${{ needs.parse-tag.outputs.version }}" ]; then
            echo "pyproject version $PYVER != tag version ${{ needs.parse-tag.outputs.version }}" >&2
            exit 1
          fi

      - name: Build sdist + wheel
        run: python -m build --sdist --wheel --outdir dist/

      - name: Install wheel and run tests
        run: |
          pip install dist/*.whl
          if [ -d tests ]; then pytest tests -vs; fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: ${{ needs.parse-tag.outputs.dir }}/dist/*

  build-rust:
    needs: parse-tag
    if: ${{ needs.parse-tag.outputs.package == 'rs' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-parity-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Verify workspace version matches tag
        run: |
          CARGO_VER=$(awk -F\" '/^version =/ {print $2; exit}' Cargo.toml)
          if [ "$CARGO_VER" != "${{ needs.parse-tag.outputs.version }}" ]; then
            echo "Cargo workspace version $CARGO_VER != tag version ${{ needs.parse-tag.outputs.version }}" >&2
            exit 1
          fi

      - run: cargo test --workspace --all-features

  draft-release:
    needs: [parse-tag, build-python, build-rust]
    if: ${{ always() && (needs.build-python.result == 'success' || needs.build-rust.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Download Python dist
        if: ${{ needs.parse-tag.outputs.package != 'rs' }}
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.parse-tag.outputs.dir }} v${{ needs.parse-tag.outputs.version }}
          tag_name: ${{ github.ref_name }}
          draft: true
          files: dist/*
          fail_on_unmatched_files: false

      - name: Attest Python artifacts
        if: ${{ needs.parse-tag.outputs.package != 'rs' }}
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/*
