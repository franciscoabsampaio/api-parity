[project]
name = "api-parity"
version = "0.0.3"
description = "Cross-language API parity differ and report renderer."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[project.urls]
Homepage = "https://github.com/franciscoabsampaio/api-parity"
Repository = "https://github.com/franciscoabsampaio/api-parity"
Issues = "https://github.com/franciscoabsampaio/api-parity/issues"
Changelog = "https://github.com/franciscoabsampaio/api-parity/blob/main/CHANGELOG.md"

[project.scripts]
api-parity = "api_parity.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api_parity"]
