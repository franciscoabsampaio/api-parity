[project]
name = "api-parity"
version = "0.0.2"
description = "Cross-language API parity differ and report renderer."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
api-parity = "api_parity.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api_parity"]
